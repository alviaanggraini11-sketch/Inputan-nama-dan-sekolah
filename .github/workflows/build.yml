

name: Build C++ to EXE

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download Source Code
        uses: actions/checkout@v4

      - name: Setup MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc

      - name: Compile C++ to EXE
        shell: msys2 {0}
        run: g++ inputan_nama.cpp -o inputan_nama.exe -static

      - name: Check EXE
        shell: pwsh
        run: |
          if (!(Test-Path "inputan_nama.exe")) {
            throw "File EXE tidak ditemukan!"
          }
          Get-Item "inputan_nama.exe"

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: aplikasi-windows
          path: inputan_nama.exe
          if-no-files-found: error
