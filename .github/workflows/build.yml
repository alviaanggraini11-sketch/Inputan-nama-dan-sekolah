
name: Build C++ EXE

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MinGW
        uses: egor-tensin/setup-mingw@v2

      - name: Compile main.cpp
        shell: pwsh
        run: |
          g++ -std=c++17 -O2 -static -static-libgcc -static-libstdc++ main.cpp -o main.exe
          if ($LASTEXITCODE -ne 0) {
            throw "Kompilasi gagal"
          }

      - name: Check EXE
        shell: pwsh
        run: |
          Get-Item main.exe | Select-Object Name, Length

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: main-exe
          path: main.exe
